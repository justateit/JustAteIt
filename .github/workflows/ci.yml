name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    # Pinned: ubuntu-latest moved to 26.04, which ships no Python 3.9 build.
    # 3.9 is what the service Dockerfiles run, so CI stays on it for parity.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Expo 58 / React Native 0.88 require >=22.13, and the lockfile is
          # written by npm 11 — which npm 10 (bundled with Node 20) rejects.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Expo web export
        run: npm run build:web

  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Lint CloudFormation templates
        run: cfn-lint infra/cloudformation/*.yml
